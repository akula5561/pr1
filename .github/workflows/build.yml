name: Build project

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: eclipse-temurin:21

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set execute permission for mvnw
        run: chmod +x mvnw

      - name: Build, test and package
        run: ./mvnw clean package

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-artifact
          path: ./target/*.jar

  sast:
    needs: build
    runs-on: ubuntu-latest

    container:
      image: returntocorp/semgrep:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: semgrep --config=auto --sarif --output=semgrep.sarif .

      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

      - name: Upload Semgrep artifact
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif

  sca:
    needs: build
    runs-on: ubuntu-latest

    container:
      image: eclipse-temurin:21

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set execute permission for mvnw
        run: chmod +x mvnw

      - name: Run OWASP Dependency Check
        continue-on-error: true
        run: ./mvnw org.owasp:dependency-check-maven:check

      - name: Upload dependency check report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          if-no-files-found: warn

  dast-baseline:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download jar artifact
        uses: actions/download-artifact@v4
        with:
          name: jar-artifact

      - name: Prepare ZAP rules file
        run: touch zap-rules.tsv

      - name: Start application
        run: |
          java -jar *.jar &
          sleep 30

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.9.0
        with:
          target: "http://localhost:8080"
          rules_file_name: "zap-rules.tsv"

      - name: Upload ZAP baseline report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: |
            report_html.html
            report_md.md
          if-no-files-found: warn

  dast-api:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download jar artifact
        uses: actions/download-artifact@v4
        with:
          name: jar-artifact

      - name: Prepare ZAP rules file
        run: touch zap-rules.tsv

      - name: Start application
        run: |
          java -jar *.jar &
          sleep 40

      - name: Run OWASP ZAP API Scan
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: "http://localhost:8080/v3/api-docs"
          format: openapi
          rules_file_name: "zap-rules.tsv"
          allow_issue_writing: false

      - name: Upload ZAP API report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: zap-api-report
          path: |
            report_html.html
            report_md.md
          if-no-files-found: warn